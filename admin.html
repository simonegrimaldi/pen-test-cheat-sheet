<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin — pentest cheatsheet</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg?v=2">
<link rel="icon" type="image/png" href="/img/icons8-sicurezza-informatica-50.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;450;500&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --bg:#0b0f1a;--bg-grad:#0c1322;--surface:#111a2b;--surface-2:#0e1626;
    --line:#223049;--line-soft:#1a2436;--text:#cdd6e5;--text-dim:#808fab;--text-faint:#56637d;
    --amber:#f0b429;--amber-soft:rgba(240,180,41,.13);--amber-line:rgba(240,180,41,.35);
    --cyan:#4cc8c0;--blue:#5b9bd5;--orange:#e8853a;--violet:#a98bdb;--red:#e06c6c;
    --green:#4ade80;--green-soft:rgba(74,222,128,.12);
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    box-sizing:border-box;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;
    background:radial-gradient(1200px 600px at 80% -10%,#10203a 0%,transparent 60%),
      linear-gradient(180deg,var(--bg-grad),var(--bg));
    background-attachment:fixed;
    color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- Login overlay ---- */
  .login-overlay{
    position:fixed;inset:0;z-index:100;
    background:rgba(10,14,24,.96);
    display:flex;align-items:center;justify-content:center;
  }
  .login-overlay.hidden{display:none}
  .login-box{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:36px 32px;width:100%;max-width:380px;
  }
  .login-box h1{font-family:var(--mono);font-size:18px;margin:0 0 6px;color:var(--amber)}
  .login-box .sub{color:var(--text-faint);font-size:13px;margin:0 0 24px}
  .login-box label{
    display:block;font-family:var(--mono);font-size:11px;color:var(--text-dim);
    letter-spacing:.04em;margin-bottom:5px;
  }
  .login-box input{
    display:block;width:100%;font-family:var(--mono);font-size:15px;font-weight:500;
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:10px 12px;margin-bottom:16px;
    transition:border-color .15s,box-shadow .15s;
  }
  .login-box input:focus{outline:none;border-color:var(--amber-line);box-shadow:0 0 0 3px var(--amber-soft)}
  .login-box .btn-login{
    width:100%;padding:11px;border:none;border-radius:7px;
    background:var(--amber);color:#0b0f1a;font-family:var(--mono);font-size:14px;font-weight:600;
    cursor:pointer;transition:opacity .15s;
  }
  .login-box .btn-login:hover{opacity:.85}
  .login-err{color:var(--red);font-family:var(--mono);font-size:12px;margin:0 0 12px;min-height:16px}

  /* ---- Top bar ---- */
  .topbar{
    position:sticky;top:0;z-index:30;
    background:rgba(10,14,24,.88);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);padding:12px 22px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .topbar h1{font-family:var(--mono);font-size:15px;margin:0;color:var(--amber);flex:1}
  .topbar h1 span{color:var(--text-dim);font-weight:400}
  .topbar .btn{
    font-family:var(--mono);font-size:12px;padding:7px 14px;border-radius:7px;
    border:1px solid var(--line);background:var(--surface);color:var(--text-dim);
    cursor:pointer;transition:all .15s;white-space:nowrap;
  }
  .topbar .btn:hover{border-color:var(--text-faint);color:var(--text)}
  .topbar .btn.primary{background:var(--amber);color:#0b0f1a;border-color:var(--amber);font-weight:600}
  .topbar .btn.primary:hover{opacity:.85}
  .topbar .btn.danger{border-color:var(--red);color:var(--red)}
  .topbar .btn.danger:hover{background:rgba(224,108,108,.12)}

  /* ---- Layout ---- */
  .admin-wrap{max-width:960px;margin:0 auto;padding:24px 22px 80px}

  /* ---- Phase block ---- */
  .adm-phase{
    background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;
    margin-bottom:16px;overflow:hidden;
  }
  .adm-phase-head{
    display:flex;align-items:center;gap:12px;padding:14px 16px;
    border-bottom:1px solid var(--line-soft);cursor:pointer;user-select:none;
  }
  .adm-phase-head:hover{background:var(--surface-2)}
  .adm-phase-head .chevron{
    color:var(--text-faint);font-size:12px;transition:transform .2s;flex:none;width:16px;text-align:center;
  }
  .adm-phase-head .chevron.open{transform:rotate(90deg)}
  .adm-phase-head .pdot{width:10px;height:10px;border-radius:50%;flex:none}
  .adm-phase-head .pname{font-family:var(--mono);font-size:14px;font-weight:600;flex:1}
  .adm-phase-head .pidx{font-family:var(--mono);font-size:11px;color:var(--text-faint)}
  .adm-phase-head .cnt{
    font-family:var(--mono);font-size:11px;color:var(--text-faint);
    background:var(--surface-2);padding:2px 8px;border-radius:4px;
  }
  .adm-phase-head .phase-actions{display:flex;gap:6px}
  .adm-phase-head .phase-actions .abtn{
    font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:5px;
    border:1px solid var(--line);background:transparent;color:var(--text-faint);
    cursor:pointer;transition:all .15s;
  }
  .adm-phase-head .phase-actions .abtn:hover{color:var(--text);border-color:var(--text-faint)}
  .adm-phase-head .phase-actions .abtn.del{border-color:rgba(224,108,108,.3);color:var(--red)}
  .adm-phase-head .phase-actions .abtn.del:hover{background:rgba(224,108,108,.1)}
  .adm-phase-body{display:none;padding:0 16px 14px}
  .adm-phase-body.open{display:block}

  /* ---- Phase meta edit ---- */
  .phase-meta{
    display:grid;grid-template-columns:80px 1fr 1fr;gap:10px;
    padding:12px 0;border-bottom:1px solid var(--line-soft);margin-bottom:12px;
  }
  .phase-meta .fm{display:flex;flex-direction:column;gap:4px}
  .phase-meta .fm.full{grid-column:1/-1}
  .phase-meta label{font-family:var(--mono);font-size:10px;color:var(--text-faint);letter-spacing:.04em}
  .phase-meta input,.phase-meta select{
    font-family:var(--mono);font-size:13px;
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    border-radius:5px;padding:6px 8px;
  }
  .phase-meta input:focus,.phase-meta select:focus{outline:none;border-color:var(--amber-line)}
  .phase-meta select{appearance:none;cursor:pointer}

  /* ---- Command row ---- */
  .adm-cmd{
    display:grid;grid-template-columns:1fr 1fr auto;gap:8px;
    padding:10px 12px;background:var(--surface-2);border:1px solid var(--line-soft);
    border-radius:8px;margin-bottom:6px;align-items:start;
  }
  .adm-cmd .fm{display:flex;flex-direction:column;gap:3px}
  .adm-cmd .fm.wide{grid-column:1/-1}
  .adm-cmd label{font-family:var(--mono);font-size:9.5px;color:var(--text-faint);letter-spacing:.04em}
  .adm-cmd input,.adm-cmd textarea{
    font-family:var(--mono);font-size:12.5px;
    background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:5px;padding:6px 8px;resize:vertical;
  }
  .adm-cmd textarea{min-height:54px;line-height:1.45}
  .adm-cmd input:focus,.adm-cmd textarea:focus{outline:none;border-color:var(--amber-line)}
  .adm-cmd .cmd-actions{
    display:flex;flex-direction:column;gap:4px;padding-top:16px;
  }
  .adm-cmd .cmd-actions button{
    font-family:var(--mono);font-size:10px;padding:5px 8px;border-radius:5px;
    border:1px solid var(--line);background:transparent;color:var(--text-faint);
    cursor:pointer;transition:all .15s;white-space:nowrap;
  }
  .adm-cmd .cmd-actions button:hover{color:var(--text);border-color:var(--text-faint)}
  .adm-cmd .cmd-actions .del{border-color:rgba(224,108,108,.3);color:var(--red)}
  .adm-cmd .cmd-actions .del:hover{background:rgba(224,108,108,.1)}
  .adm-cmd .cmd-actions .up,.adm-cmd .cmd-actions .dn{font-size:13px;padding:3px 8px}

  .add-cmd-btn{
    display:flex;align-items:center;gap:6px;width:100%;
    font-family:var(--mono);font-size:12px;padding:10px;border-radius:8px;
    border:1px dashed var(--line);background:transparent;color:var(--text-faint);
    cursor:pointer;transition:all .15s;justify-content:center;margin-top:4px;
  }
  .add-cmd-btn:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(76,200,192,.05)}

  .add-phase-btn{
    display:flex;align-items:center;gap:8px;width:100%;
    font-family:var(--mono);font-size:13px;padding:16px;border-radius:12px;
    border:1px dashed var(--line);background:transparent;color:var(--text-faint);
    cursor:pointer;transition:all .15s;justify-content:center;margin-top:8px;
  }
  .add-phase-btn:hover{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}

  /* ---- Toast ---- */
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--surface);border:1px solid var(--green);color:var(--text);
    font-family:var(--mono);font-size:13px;padding:10px 18px;border-radius:9px;
    box-shadow:0 10px 40px rgba(0,0,0,.5);opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast b{color:var(--green)}
  .toast.err{border-color:var(--red)}
  .toast.err b{color:var(--red)}

  /* ---- Confirm modal ---- */
  .modal-overlay{
    position:fixed;inset:0;z-index:90;background:rgba(10,14,24,.8);
    display:flex;align-items:center;justify-content:center;
  }
  .modal-overlay.hidden{display:none}
  .modal-box{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:24px;width:100%;max-width:400px;
  }
  .modal-box p{margin:0 0 18px;font-size:14px;color:var(--text)}
  .modal-box .modal-btns{display:flex;gap:10px;justify-content:flex-end}
  .modal-box .modal-btns button{
    font-family:var(--mono);font-size:12px;padding:8px 16px;border-radius:7px;
    border:1px solid var(--line);background:var(--surface-2);color:var(--text-dim);
    cursor:pointer;transition:all .15s;
  }
  .modal-box .modal-btns button:hover{color:var(--text);border-color:var(--text-faint)}
  .modal-box .modal-btns .confirm{background:var(--red);color:#fff;border-color:var(--red)}
  .modal-box .modal-btns .confirm:hover{opacity:.85}

  @media(max-width:700px){
    .admin-wrap{padding:16px 14px 60px}
    .adm-cmd{grid-template-columns:1fr}
    .adm-cmd .cmd-actions{flex-direction:row}
    .phase-meta{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<!-- ---- LOGIN ---- -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h1>⚙ admin panel</h1>
    <p class="sub">Accedi per gestire i comandi del cheatsheet.</p>
    <p class="login-err" id="loginErr"></p>
    <label>USER</label>
    <input type="text" id="loginUser" autocomplete="username" spellcheck="false" placeholder="username">
    <label>PASSWORD</label>
    <input type="password" id="loginPass" autocomplete="current-password" placeholder="••••••••">
    <button class="btn-login" id="loginBtn">Accedi</button>
  </div>
</div>

<!-- ---- TOPBAR ---- -->
<div class="topbar" id="topbar" style="display:none">
  <h1>⚙ admin <span>— pentest cheatsheet</span></h1>
  <button class="btn" id="btnBack">← cheatsheet</button>
  <button class="btn" id="btnExport">esporta JSON</button>
  <button class="btn" id="btnImport">importa JSON</button>
  <button class="btn danger" id="btnReset">reset default</button>
  <button class="btn primary" id="btnSave">💾 salva modifiche</button>
  <button class="btn danger" id="btnLogout" style="border-color:var(--text-faint);color:var(--text-faint)">logout</button>
</div>

<!-- ---- MAIN ---- -->
<div class="admin-wrap" id="adminWrap" style="display:none">
  <div id="phasesList"></div>
  <button class="add-phase-btn" id="btnAddPhase">+ aggiungi fase</button>
</div>

<input type="file" id="fileImport" accept=".json" style="display:none">

<!-- ---- TOAST ---- -->
<div class="toast" id="toast"></div>

<!-- ---- CONFIRM MODAL ---- -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-box">
    <p id="modalMsg"></p>
    <div class="modal-btns">
      <button id="modalCancel">annulla</button>
      <button class="confirm" id="modalConfirm">conferma</button>
    </div>
  </div>
</div>

<script>
/* ============ AUTH ============ */
const CREDS_USER = 'admin';
const CREDS_HASH = '6d222657787368ad3b12cde1e04a61978ed8301627d7eb7d13334157b65118d0'; // sha256('gregoriomerda')
const AUTH_KEY = 'pentest-admin-auth';

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function isLoggedIn() {
  try {
    const s = JSON.parse(sessionStorage.getItem(AUTH_KEY)||'{}');
    return s && s.ok === true && s.ts && (Date.now()-s.ts < 3600000);
  } catch(e) { return false; }
}

function setLoggedIn() {
  sessionStorage.setItem(AUTH_KEY, JSON.stringify({ok:true,ts:Date.now()}));
}

function logout() {
  sessionStorage.removeItem(AUTH_KEY);
  location.reload();
}

const loginOverlay = document.getElementById('loginOverlay');
const loginErr = document.getElementById('loginErr');
const loginBtn = document.getElementById('loginBtn');
const loginUser = document.getElementById('loginUser');
const loginPass = document.getElementById('loginPass');

loginBtn.addEventListener('click', doLogin);
loginPass.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
loginUser.addEventListener('keydown', e=>{ if(e.key==='Enter') loginPass.focus(); });

async function doLogin() {
  const u = loginUser.value.trim();
  const p = loginPass.value;
  if (!u || !p) { loginErr.textContent='Inserisci utente e password.'; return; }
  if (u !== CREDS_USER) { loginErr.textContent='Credenziali errate.'; return; }
  const h = await sha256(p);
  if (h !== CREDS_HASH) { loginErr.textContent='Credenziali errate.'; return; }
  setLoggedIn();
  showAdmin();
}

function showAdmin() {
  loginOverlay.classList.add('hidden');
  document.getElementById('topbar').style.display='';
  document.getElementById('adminWrap').style.display='';
  loadData();
  renderAll();
}

if (isLoggedIn()) { showAdmin(); } else { loginUser.focus(); }

/* ============ DATA ============ */
const LS_DATA = 'pentest-cheatsheet-custom';

const DEFAULT_PHASES = [
  {
    id:"recon", idx:"01", name:"Reconnaissance", color:"var(--cyan)",
    desc:"Scoprire il proprio IP, gli host vivi sulla rete e le porte/servizi aperti sul bersaglio.",
    cmds:[
      {c:"ifconfig", n:"Mostra il tuo indirizzo IP e l'interfaccia di rete. Alternativa moderna: ip a.", d:["man ifconfig","https://man7.org/linux/man-pages/man8/ifconfig.8.html"]},
      {c:"sudo netdiscover -r {{LHOST}}/24", n:"Enumera gli host vivi sulla tua sottorete via ARP, senza inviare pacchetti rumorosi.", d:["netdiscover","https://github.com/netdiscover-scanner/netdiscover"]},
      {c:"nmap -sn {{LHOST}}/24", n:"Ping/ARP sweep: elenca gli host attivi nella /24 senza scansionare le porte.", d:["nmap host discovery","https://nmap.org/book/host-discovery.html"]},
      {c:"sudo nmap {{TARGET}} -p- -A -T4 -Pn -oN scan.txt", n:"Scansione completa di tutte le 65535 porte con rilevamento servizi/OS, salvata su file. Scan di riferimento.", d:["nmap man","https://nmap.org/book/man.html"]},
      {c:"nmap -sCV -p- {{TARGET}} -vvv", n:"Tutte le porte con script di default + versione dei servizi, output verboso per più dettagli.", d:["nmap -sC -sV","https://nmap.org/book/man-version-detection.html"]},
      {c:"nmap -A {{TARGET}} -Pn", n:"Scansione aggressiva rapida sulle porte comuni, saltando il controllo \"host up\".", d:["nmap man","https://nmap.org/book/man.html"]},
      {c:"nmap {{TARGET}} -p <PORTS> -A", n:"Approfondisci solo le porte già trovate aperte (es. 80,443,7744) con servizi e script.", d:["nmap -p","https://nmap.org/book/man-port-specification.html"]},
      {c:"nmap --script=vuln {{TARGET}}", n:"Lancia tutti gli script NSE della categoria \"vuln\": scansione automatica di vulnerabilità note.", d:["nmap NSE vuln","https://nmap.org/nsedoc/categories/vuln.html"]},
      {c:"nmap -p<PORT> --script <SCRIPT> {{TARGET}}", n:"Esegue un singolo script NSE su una porta (es. --script http-vuln-cve2014-3704).", d:["NSE scripts","https://nmap.org/nsedoc/"]},
      {c:"nmap -p139 --script smb-enum-shares {{TARGET}}", n:"Enumera le condivisioni SMB e i relativi permessi di lettura/scrittura sul bersaglio.", d:["smb-enum-shares","https://nmap.org/nsedoc/scripts/smb-enum-shares.html"]},
    ]
  },
  {
    id:"enum", idx:"02", name:"Enumeration", color:"var(--blue)",
    desc:"Mappare il web server, le directory nascoste, gli utenti e cercare exploit per le versioni trovate.",
    cmds:[
      {c:"dirsearch -u http://{{TARGET}}/ --http-method=GET --exclude-status=300-399,400-499,500-599", n:"Enumera directory e file nascosti scartando i codici di errore/redirect.", d:["dirsearch","https://github.com/maurosoria/dirsearch"]},
      {c:"gobuster dir -u http://{{TARGET}}/ -w /usr/share/dirb/wordlists/common.txt", n:"Brute force di directory e file su un web server, anche senza link visibili.", d:["gobuster","https://github.com/OJ/gobuster"]},
      {c:"ffuf -w /usr/share/dirb/wordlists/common.txt -u http://{{TARGET}}/FUZZ", n:"Fuzzing dei percorsi: sostituisce FUZZ con ogni parola della wordlist.", d:["ffuf","https://github.com/ffuf/ffuf"]},
      {c:"ffuf -w /usr/share/wordlists/dirbuster/directory-list-2.3-medium.txt -u http://{{TARGET}}/FUZZ -c -ic -fc 403,404 -e .txt", n:"Fuzzing più profondo: ignora i commenti, filtra 403/404 e prova anche l'estensione .txt.", d:["ffuf options","https://github.com/ffuf/ffuf#usage"]},
      {c:"nikto -h http://{{TARGET}}/", n:"Scansione del web server: header, file sensibili, certificato SSL/TLS e vulnerabilità note.", d:["nikto","https://github.com/sullo/nikto"]},
      {c:"curl -i http://{{TARGET}}/robots.txt", n:"Spesso rivela percorsi che il sito vuole tenere nascosti (Disallow). Vale sempre un'occhiata.", d:["curl","https://curl.se/docs/manpage.html"]},
      {c:"smbclient -L //{{TARGET}}/ -N", n:"Elenca le condivisioni SMB in accesso anonimo (-N = senza password).", d:["smbclient","https://www.samba.org/samba/docs/current/man-html/smbclient.1.html"]},
      {c:"wpscan --url http://{{TARGET}}/ -e u", n:"Enumera gli utenti registrati di un sito WordPress.", d:["wpscan","https://github.com/wpscanteam/wpscan"]},
      {c:"wpscan --url https://{{TARGET}}:<PORT>/<path> -e u --disable-tls-checks", n:"Come sopra ma su HTTPS, ignorando un certificato non valido.", d:["wpscan","https://github.com/wpscanteam/wpscan"]},
      {c:"wpscan --url http://{{TARGET}}/ -U <USER> -P /usr/share/wordlists/rockyou.txt", n:"Attacco a dizionario sulla password di un utente WordPress. rockyou è intercambiabile con altre wordlist.", d:["wpscan","https://github.com/wpscanteam/wpscan"]},
      {c:"cewl -w password.txt http://{{TARGET}}/", n:"Costruisce una wordlist dalle parole presenti nel sito, utile per attacchi a dizionario mirati.", d:["cewl","https://github.com/digininja/CeWL"]},
      {c:"searchsploit <SERVICE> <VERSION>", n:"Cerca su Exploit-DB exploit noti per un servizio e una versione (es. ProFTPD 1.3.3c).", d:["searchsploit","https://www.exploit-db.com/searchsploit"]},
    ]
  },
  {
    id:"exploit", idx:"03", name:"Exploitation", color:"var(--orange)",
    desc:"Sfruttare un servizio vulnerabile con Metasploit o aprire una reverse shell manuale verso di te.",
    cmds:[
      {c:"msfconsole -q", n:"Avvia la console Metasploit senza banner.", d:["metasploit","https://docs.metasploit.com/"]},
      {c:"search <TERM>", n:"Dentro msf: cerca un modulo (es. trans2open, smb_version, drupal).", d:["msf search","https://docs.metasploit.com/docs/using-metasploit/basics/using-metasploit.html"]},
      {c:"use <MODULE>", n:"Seleziona il modulo/exploit trovato.", d:["metasploit","https://docs.metasploit.com/"]},
      {c:"show options", n:"Mostra i parametri richiesti dal modulo selezionato.", d:["metasploit","https://docs.metasploit.com/"]},
      {c:"set RHOSTS {{TARGET}}", n:"Imposta l'host bersaglio.", d:["metasploit","https://docs.metasploit.com/"]},
      {c:"set RPORT <PORT>", n:"Imposta la porta del servizio bersaglio (es. 139 per Samba).", d:["metasploit","https://docs.metasploit.com/"]},
      {c:"set LHOST {{LHOST}}", n:"Il tuo IP: dove il payload richiamerà la connessione inversa.", d:["metasploit","https://docs.metasploit.com/"]},
      {c:"set LPORT {{LPORT}}", n:"La porta su cui riceverai la shell.", d:["metasploit","https://docs.metasploit.com/"]},

const COLOR_OPTIONS = [
  {label:'cyan',    val:'var(--cyan)'},
  {label:'blue',    val:'var(--blue)'},
  {label:'orange',  val:'var(--orange)'},
  {label:'violet',  val:'var(--violet)'},
  {label:'red',     val:'var(--red)'},
  {label:'amber',   val:'var(--amber)'},
];

let phases = [];

function loadData() {
  try {
    const raw = localStorage.getItem(LS_DATA);
    if (raw) {
      phases = JSON.parse(raw);
      return;
    }
  } catch(e) {}
  phases = JSON.parse(JSON.stringify(DEFAULT_PHASES));
}

function saveData() {
  try {
    localStorage.setItem(LS_DATA, JSON.stringify(phases));
  } catch(e) {
    showToast('Errore nel salvataggio!', true);
  }
}

/* ============ RENDER ============ */
const phasesList = document.getElementById('phasesList');

function renderAll() {
  phasesList.innerHTML = '';
  phases.forEach((ph, pi) => {
    const block = document.createElement('div');
    block.className = 'adm-phase';
    block.dataset.pi = pi;

    // Header
    const head = document.createElement('div');
    head.className = 'adm-phase-head';
    head.innerHTML = `
      <span class="chevron">▶</span>
      <span class="pdot" style="background:${ph.color}"></span>
      <span class="pname">${esc(ph.name)}</span>
      <span class="pidx">${esc(ph.idx)}</span>
      <span class="cnt">${ph.cmds.length} cmd</span>
      <span class="phase-actions">
        <button class="abtn" data-act="up-phase" title="Sposta su">↑</button>
        <button class="abtn" data-act="dn-phase" title="Sposta giù">↓</button>
        <button class="abtn del" data-act="del-phase" title="Elimina fase">✕</button>
      </span>
    `;

    // Toggle open/close
    head.addEventListener('click', e => {
      if (e.target.closest('.phase-actions')) return;
      const chev = head.querySelector('.chevron');
      const body = block.querySelector('.adm-phase-body');
      chev.classList.toggle('open');
      body.classList.toggle('open');
    });

    // Phase actions
    head.querySelectorAll('[data-act]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const act = btn.dataset.act;
        if (act === 'del-phase') {
          confirmModal(`Eliminare la fase "${ph.name}"?`, () => {
            phases.splice(pi, 1);
            reindex();
            renderAll();
          });
        } else if (act === 'up-phase' && pi > 0) {
          [phases[pi-1], phases[pi]] = [phases[pi], phases[pi-1]];
          reindex(); renderAll();
        } else if (act === 'dn-phase' && pi < phases.length-1) {
          [phases[pi], phases[pi+1]] = [phases[pi+1], phases[pi]];
          reindex(); renderAll();
        }
      });
    });

    block.appendChild(head);

    // Body
    const body = document.createElement('div');
    body.className = 'adm-phase-body';

    // Phase meta
    const meta = document.createElement('div');
    meta.className = 'phase-meta';
    meta.innerHTML = `
      <div class="fm">
        <label>IDX</label>
        <input type="text" value="${esc(ph.idx)}" data-field="idx" maxlength="4">
      </div>
      <div class="fm">
        <label>NOME</label>
        <input type="text" value="${esc(ph.name)}" data-field="name">
      </div>
      <div class="fm">
        <label>COLORE</label>
        <select data-field="color">
          ${COLOR_OPTIONS.map(c=>`<option value="${c.val}" ${ph.color===c.val?'selected':''}>${c.label}</option>`).join('')}
        </select>
      </div>
      <div class="fm full">
        <label>DESCRIZIONE</label>
        <input type="text" value="${esc(ph.desc)}" data-field="desc">
      </div>
    `;
    meta.querySelectorAll('[data-field]').forEach(inp => {
      inp.addEventListener('input', () => {
        phases[pi][inp.dataset.field] = inp.value;
        if (inp.dataset.field === 'name') {
          phases[pi].id = inp.value.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-+$/,'');
          head.querySelector('.pname').textContent = inp.value;
        }
        if (inp.dataset.field === 'idx') head.querySelector('.pidx').textContent = inp.value;
        if (inp.dataset.field === 'color') {
          head.querySelector('.pdot').style.background = inp.value;
        }
      });
    });
    body.appendChild(meta);

    // Commands
    ph.cmds.forEach((cmd, ci) => {
      body.appendChild(buildCmdRow(pi, ci, cmd));
    });

    // Add command button
    const addBtn = document.createElement('button');
    addBtn.className = 'add-cmd-btn';
    addBtn.textContent = '+ aggiungi comando';
    addBtn.addEventListener('click', () => {
      phases[pi].cmds.push({c:'', n:'', d:['','']});
      renderAll();
      // Open the phase and scroll to bottom
      const newBlock = phasesList.children[pi];
      newBlock.querySelector('.chevron').classList.add('open');
      newBlock.querySelector('.adm-phase-body').classList.add('open');
      const cmds = newBlock.querySelectorAll('.adm-cmd');
      cmds[cmds.length-1].scrollIntoView({behavior:'smooth',block:'center'});
    });
    body.appendChild(addBtn);

    block.appendChild(body);
    phasesList.appendChild(block);
  });
}

function buildCmdRow(pi, ci, cmd) {
  const row = document.createElement('div');
  row.className = 'adm-cmd';

  row.innerHTML = `
    <div class="fm wide">
      <label>COMANDO</label>
      <textarea data-field="c">${esc(cmd.c)}</textarea>
    </div>
    <div class="fm wide">
      <label>NOTA</label>
      <textarea data-field="n">${esc(cmd.n)}</textarea>
    </div>
    <div class="fm">
      <label>DOCS LABEL</label>
      <input type="text" value="${esc(cmd.d?cmd.d[0]:'')}" data-field="d0">
    </div>
    <div class="fm">
      <label>DOCS URL</label>
      <input type="text" value="${esc(cmd.d?cmd.d[1]:'')}" data-field="d1">
    </div>
    <div class="cmd-actions">
      <button class="up" data-act="up" title="Sposta su">↑</button>
      <button class="dn" data-act="dn" title="Sposta giù">↓</button>
      <button class="del" data-act="del" title="Elimina">✕</button>
    </div>
  `;

  // Bind inputs
  row.querySelectorAll('[data-field]').forEach(inp => {
    inp.addEventListener('input', () => {
      const f = inp.dataset.field;
      if (f === 'c') phases[pi].cmds[ci].c = inp.value;
      else if (f === 'n') phases[pi].cmds[ci].n = inp.value;
      else if (f === 'd0') {
        if (!phases[pi].cmds[ci].d) phases[pi].cmds[ci].d = ['',''];
        phases[pi].cmds[ci].d[0] = inp.value;
      }
      else if (f === 'd1') {
        if (!phases[pi].cmds[ci].d) phases[pi].cmds[ci].d = ['',''];
        phases[pi].cmds[ci].d[1] = inp.value;
      }
    });
  });

  // Actions
  row.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', () => {
      const act = btn.dataset.act;
      const cmds = phases[pi].cmds;
      if (act === 'del') {
        cmds.splice(ci, 1);
        renderAll();
        openPhase(pi);
      } else if (act === 'up' && ci > 0) {
        [cmds[ci-1], cmds[ci]] = [cmds[ci], cmds[ci-1]];
        renderAll();
        openPhase(pi);
      } else if (act === 'dn' && ci < cmds.length-1) {
        [cmds[ci], cmds[ci+1]] = [cmds[ci+1], cmds[ci]];
        renderAll();
        openPhase(pi);
      }
    });
  });

  return row;
}

function openPhase(pi) {
  const block = phasesList.children[pi];
  if (!block) return;
  block.querySelector('.chevron').classList.add('open');
  block.querySelector('.adm-phase-body').classList.add('open');
}

function reindex() {
  phases.forEach((ph, i) => {
    ph.idx = String(i+1).padStart(2,'0');
  });
}

/* ============ TOPBAR ACTIONS ============ */
document.getElementById('btnSave').addEventListener('click', () => {
  saveData();
  showToast('Modifiche salvate!');
});

document.getElementById('btnBack').addEventListener('click', () => {
  window.location.href = 'index.html';
});

document.getElementById('btnLogout').addEventListener('click', logout);

document.getElementById('btnReset').addEventListener('click', () => {
  confirmModal('Ripristinare tutti i dati di default? Le modifiche andranno perse.', () => {
    phases = JSON.parse(JSON.stringify(DEFAULT_PHASES));
    saveData();
    renderAll();
    showToast('Dati ripristinati ai default.');
  });
});

document.getElementById('btnExport').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(phases, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cheatsheet-data.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('JSON esportato!');
});

const fileImport = document.getElementById('fileImport');
document.getElementById('btnImport').addEventListener('click', () => fileImport.click());
fileImport.addEventListener('change', () => {
  const f = fileImport.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data)) throw new Error('not array');
      phases = data;
      saveData();
      renderAll();
      showToast('Dati importati!');
    } catch(e) {
      showToast('File JSON non valido!', true);
    }
  };
  reader.readAsText(f);
  fileImport.value = '';
});

document.getElementById('btnAddPhase').addEventListener('click', () => {
  const idx = String(phases.length+1).padStart(2,'0');
  phases.push({
    id:'new-phase-'+idx,
    idx: idx,
    name:'Nuova Fase',
    color:'var(--cyan)',
    desc:'',
    cmds:[]
  });
  renderAll();
  const block = phasesList.children[phases.length-1];
  block.querySelector('.chevron').classList.add('open');
  block.querySelector('.adm-phase-body').classList.add('open');
  block.scrollIntoView({behavior:'smooth',block:'center'});
});

/* ============ HELPERS ============ */
function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const toastEl = document.getElementById('toast');
let toastTimer;
function showToast(msg, isErr) {
  toastEl.innerHTML = (isErr?'❌ ':'✓ ') + '<b>' + msg + '</b>';
  toastEl.className = 'toast show' + (isErr?' err':'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toastEl.className = 'toast', 2000);
}

/* ---- Confirm modal ---- */
const modalOverlay = document.getElementById('modalOverlay');
const modalMsg = document.getElementById('modalMsg');
const modalConfirm = document.getElementById('modalConfirm');
const modalCancel = document.getElementById('modalCancel');
let modalCb = null;

function confirmModal(msg, cb) {
  modalMsg.textContent = msg;
  modalCb = cb;
  modalOverlay.classList.remove('hidden');
}
modalCancel.addEventListener('click', () => {
  modalOverlay.classList.add('hidden');
  modalCb = null;
});
modalConfirm.addEventListener('click', () => {
  modalOverlay.classList.add('hidden');
  if (modalCb) modalCb();
  modalCb = null;
});
modalOverlay.addEventListener('click', e => {
  if (e.target === modalOverlay) {
    modalOverlay.classList.add('hidden');
    modalCb = null;
  }
});
</script>
</body>
